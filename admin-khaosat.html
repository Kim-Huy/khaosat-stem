<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ADMIN KHẢO SÁT STEM</title>

<style>

body{

margin:0;
padding:20px;

background:#050816;

font-family:Arial;

color:white;

}

h1{

text-align:center;

margin-bottom:30px;

}

/* NOTICE */

#noticeBox{

position:sticky;

top:10px;

z-index:999;

background:#111827;

padding:15px;

border-radius:15px;

margin-bottom:20px;

font-weight:bold;

display:none;

backdrop-filter:blur(10px);

}

/* CARD */

.card{

background:rgba(255,255,255,0.08);

padding:20px;

margin-bottom:20px;

border-radius:20px;

backdrop-filter:blur(10px);

border:1px solid rgba(255,255,255,0.1);

position:relative;

}

.card h2{

margin-top:0;

font-size:30px;

}

/* BUTTON */

button{

padding:10px 15px;

border:none;

border-radius:10px;

background:#3b82f6;

color:white;

cursor:pointer;

margin-top:10px;

margin-right:10px;

font-size:15px;

}

button:hover{

opacity:0.9;

}

/* ANSWERS */

.answersContainer{

display:none;

margin-top:20px;

}

.answer{

margin-bottom:18px;

padding:15px;

background:rgba(255,255,255,0.05);

border-radius:12px;

}

.questionTitle{

font-weight:bold;

margin-bottom:8px;

font-size:17px;

}

.answerText{

color:#d1d5db;

white-space:pre-wrap;

font-size:16px;

}

/* STATUS DOT */

.statusDot{

width:18px;

height:18px;

border-radius:50%;

position:absolute;

top:20px;

right:20px;

display:block;

}

.unread{

background:#ff0000;

box-shadow:0 0 15px #ff0000;

}

.read{

background:#00ff66;

box-shadow:0 0 15px #00ff66;

}

/* EXPORT TEMPLATE */

#exportTemplate{

position:absolute;

left:-99999px;

top:0;

width:1000px;

background:white;

color:black;

padding:40px;

font-family:Arial;

}

.exportTitle{

text-align:center;

font-size:35px;

font-weight:bold;

margin-bottom:20px;

}

.exportInfo{

margin-bottom:30px;

font-size:20px;

line-height:1.8;

}

.exportQuestion{

margin-bottom:20px;

padding:15px;

border:1px solid #ccc;

border-radius:10px;

}

.exportQuestion h3{

margin-top:0;

font-size:22px;

}

.exportQuestion p{

font-size:19px;

line-height:1.6;

}

</style>

</head>

<body>

<h1>ADMIN KHẢO SÁT STEM</h1>

<div id="noticeBox"></div>

<div id="data"></div>

<div id="exportTemplate"></div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {

getFirestore,
collection,
onSnapshot,
query,
orderBy

}

from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyB7UOCfnM3Y1MPDUv6Q5vAXMwokGV5lMKM",

authDomain: "khaosat-stem.firebaseapp.com",

projectId: "khaosat-stem",

storageBucket: "khaosat-stem.firebasestorage.app",

messagingSenderId: "985737529748",

appId: "1:985737529748:web:5aee9dc96980f7c306e781"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* QUESTIONS */

const questionTexts = [

"Bạn từng dùng công nghệ nào?",
"Bạn từng dùng cảm biến nào?",
"Bạn từng làm project gì?",
"Bạn từng dùng motor nào?",
"Bạn thường debug bằng gì?",
"Bạn từng dùng giao tiếp nào?",
"Bạn thích mảng nào?",
"Bạn từng làm website chưa?",
"Bạn từng dùng AI chưa?",
"Bạn từng fail project chưa?",
"Bạn từng hàn mạch chưa?",
"Bạn từng đọc datasheet chưa?",
"Bạn từng tham gia cuộc thi nào?",
"Bạn học công nghệ bằng gì?",
"Bạn thích hardware hay software?",
"Bạn từng làm robot chưa?",
"Điều khó nhất khi làm project?",
"Bạn từng dùng phần mềm nào?",
"Bạn muốn học thêm gì?",
"Điều khiến bạn thích STEM?",

"Project bạn tự hào nhất?",
"Bug khó nhất bạn từng gặp?",
"Bạn đã fix bug đó như thế nào?",
"Bạn từng thất bại project nào?",
"Bạn học được gì từ thất bại đó?",
"Bạn muốn làm project gì trong tương lai?",
"Theo bạn kỹ năng quan trọng nhất khi làm STEM là gì?",
"Bạn muốn học thêm gì trong CLB?",
"Điều khó nhất khi làm project thực tế là gì?",
"Bạn từng tự học công nghệ mới như thế nào?",
"Bạn thích teamwork hay làm cá nhân? Vì sao?",
"Nếu có đủ kinh phí bạn sẽ làm project gì?",
"Bạn nghĩ điều gì tạo nên một team STEM mạnh?",
"Mục tiêu của bạn khi tham gia CLB STEM?",
"Góp ý của bạn dành cho CLB STEM?"

];

const container =
document.getElementById('data');

const q = query(

collection(db,"submissions"),

orderBy(
"submittedAt",
"desc"
)

);

let firstLoad = true;

let unseenCount = 0;

let loadedIds = [];

/* REALTIME */

onSnapshot(q,(snapshot)=>{

snapshot.docChanges().forEach((change)=>{

if(change.type==="added"){

const doc = change.doc;

if(
loadedIds.includes(doc.id)
){

return;
}

loadedIds.push(doc.id);

const item = doc.data();

const card =
createCard(item);

if(firstLoad){

container.appendChild(card);

}else{

container.prepend(card);

unseenCount++;

updateNotice();
}
}
});

firstLoad = false;

});

/* NOTICE */

function updateNotice(){

const box =
document.getElementById(
'noticeBox'
);

if(unseenCount>0){

box.style.display='block';

box.innerText=
`${unseenCount} bài chưa xem`;

}else{

box.style.display='none';
}
}

/* TOGGLE ANSWERS */

window.toggleAnswers =
function(button){

const card =
button.closest('.card');

const box =
card.querySelector(
'.answersContainer'
);

const dot =
card.querySelector(
'.statusDot'
);

if(box.style.display==='none'){

box.style.display='block';

button.innerText='Ẩn đáp án';

/* ĐÃ XEM */

dot.classList.remove(
'unread'
);

dot.classList.add(
'read'
);

}else{

box.style.display='none';

button.innerText='Xem đáp án';
}
}

/* EXPORT IMAGE */

window.exportCard =
async function(button){

const card =
button.closest('.card');

const item =
JSON.parse(
card.dataset.item
);

const exportBox =
document.getElementById(
'exportTemplate'
);

let html = `

<div class="exportTitle">

PHIẾU KHẢO SÁT STEM

</div>

<div class="exportInfo">

<b>Họ tên:</b> ${item.name}
<br>

<b>Lớp:</b> ${item.className}
<br>

<b>Thời gian:</b>

${new Date(
item.submittedAt
).toLocaleString()}

</div>
`;

for(let i=1;i<=35;i++){

html += `

<div class="exportQuestion">

<h3>

Câu ${i}:
${questionTexts[i-1]}

</h3>

<p>

${
Array.isArray(
item.answers[`q${i}`]
)

? item.answers[`q${i}`]
.join(', ')

:

item.answers[`q${i}`]
||

'Không trả lời'
}

</p>

</div>
`;
}

exportBox.innerHTML = html;

const canvas =
await html2canvas(exportBox,{

scale:2

});

const link =
document.createElement('a');

link.download =
`${item.name}-khao-sat.png`;

link.href =
canvas.toDataURL();

link.click();

}

/* CREATE CARD */

function createCard(item){

let answersHTML='';

/* TRẮC NGHIỆM */

for(let i=1;i<=20;i++){

answersHTML += `

<div class="answer">

<div class="questionTitle">

Câu ${i}: ${questionTexts[i-1]}

</div>

<div class="answerText">

${
item.answers[`q${i}`]?.join(', ')
||
'Không trả lời'
}

</div>

</div>
`;
}

/* TỰ LUẬN */

for(let i=21;i<=35;i++){

answersHTML += `

<div class="answer">

<div class="questionTitle">

Câu ${i}: ${questionTexts[i-1]}

</div>

<div class="answerText">

${
item.answers[`q${i}`]
||
'Không trả lời'
}

</div>

</div>
`;
}

const wrapper =
document.createElement('div');

wrapper.className='card';

wrapper.dataset.item =
JSON.stringify(item);

wrapper.innerHTML = `

<span class="statusDot unread"></span>

<h2>${item.name}</h2>

<p>

<b>Lớp:</b>
${item.className}

</p>

<p>

${new Date(
item.submittedAt
).toLocaleString()}

</p>

<button onclick="toggleAnswers(this)">

Xem đáp án

</button>

<button onclick="exportCard(this)">

Xuất ảnh

</button>

<div class="answersContainer">

${answersHTML}

</div>
`;

wrapper.addEventListener('click',()=>{

if(unseenCount>0){

unseenCount--;

updateNotice();
}
});

return wrapper;
}

</script>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</body>

</html>
